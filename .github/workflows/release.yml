name: Release

# Two ways to start it (see docs/RELEASING.md):
#   1. Push a tag such as v0.9.1.
#   2. Actions -> Release -> Run workflow, on the main branch (no terminal needed). The tag is created from the
#      version in package.json.
# Either way the version in package.json, the CHANGELOG.md section and the tag must agree.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Work out the tag (it must match package.json)
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "tag $GITHUB_REF_NAME does not match package.json version $v" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Run this workflow on the main branch (it was started on $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: Install
        run: |
          # --no-package-lock: a lock file generated here must not end up in the source package.
          npm install --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
      - name: Locales, build, tests
        run: npm run check
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}" >&2; exit 1; }
          case "${TAG#v}" in
            0.*|*-*)
              printf '> **Pre-release**, published so that it can be tested on real devices. How to help: docs/BETA-TESTING.md in the repository.\n\n' | cat - notes.md > notes.tmp
              mv notes.tmp notes.md ;;
          esac
          printf '\nThe SHA-256 of every file is in SHA256SUMS.txt.\n' >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions, and versions with a suffix such as 1.0.0-rc1, are published as pre-releases.
          flags=""
          case "${TAG#v}" in
            0.*|*-*) flags="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release for this tag already exists (made by hand, or an earlier run): attach the built files to it.
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            # --target is used only when the tag does not exist yet (the manual start): the tag is made on this commit.
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "OnDemand for X ${TAG#v}" \
              --notes-file notes.md $flags
          fi
