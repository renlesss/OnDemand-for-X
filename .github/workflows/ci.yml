name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
      - name: Locales, build, tests (the tests also load the built packages as real extensions)
        run: npm run check
      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
