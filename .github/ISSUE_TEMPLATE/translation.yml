name: Translation correction
description: A text in the interface is wrong, unnatural or too long
labels: [translation]
body:
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [العربية, Deutsch, English, Español, Français, Bahasa Indonesia, 日本語, 한국어, Português (Brasil), Русский, ไทย, Türkçe, 简体中文, 繁體中文, Another language (describe below)]
    validations:
      required: true
  - type: checkboxes
    id: native
    attributes:
      label: Are you a native speaker?
      options:
        - label: Yes
  - type: textarea
    id: fix
    attributes:
      label: Which text, and what should it say?
      description: A pull request that edits `locales/<code>.json` is even better (see CONTRIBUTING.md).
    validations:
      required: true
